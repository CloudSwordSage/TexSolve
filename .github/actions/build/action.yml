name: Build TexSolve
description: Build cached UCRT64 dependencies and package TexSolve.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: dependencies
      with:
        path: third_party
        key: ${{ runner.os }}-ucrt64-third-party-${{ hashFiles('scripts/**', 'third_party.info.md') }}
    - name: Fetch and build third-party libraries
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        ./scripts/fetch_all.sh </dev/null
        project_root="$PWD"
        build=x86_64-w64-mingw32
        host=x86_64-w64-mingw32
        cmake_path="$(command -v cmake)"
        cc="$(command -v gcc)"
        cxx="$(command -v g++)"
        fc="$(command -v gfortran)"
        cflags='-O2 -pipe -std=gnu17'
        cxxflags='-O2 -pipe -std=gnu++20'
        for library in gmp mpfr eigen openblas cln symengine ceres-solver armadillo ginac sundials gsl nlopt boost; do
          "./scripts/build_librarys/${library}.sh" "$project_root" "$build" "$host" "$cmake_path" "$cc" "$cxx" "$fc" 64 "$cflags" "$cxxflags" "$(nproc)"
        done
    - name: Configure, test, and install
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cmake -G Ninja -S . -B build_gcc -DCMAKE_BUILD_TYPE=Release
        cmake --build build_gcc --parallel "$(nproc)"
        ctest --test-dir build_gcc --output-on-failure
        cmake --install build_gcc --prefix package
        ldd package/bin/texsolve.exe package/bin/texsolve.dll |
          awk '/=> \/ucrt64\/bin\// { print $3 }' |
          sort -u |
          xargs -r -I{} cp '{}' package/bin/
