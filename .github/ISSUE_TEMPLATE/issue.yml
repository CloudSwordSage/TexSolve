name: Issue
description: Report a defect or propose a concrete improvement.
title: "[Issue]: "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: State the problem or requested outcome.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or proposal
      description: Include minimal commands, input, and output when reporting a bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, TexSolve version, and dependency versions if relevant.
